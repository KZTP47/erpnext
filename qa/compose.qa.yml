# Applied after the pinned upstream disposable stack.
x-erpnext-image: &erpnext-image frappe/erpnext:develop@sha256:8309e4682b17f0b83a68d3a0583d3896129e5b8ba27f8e70d9537ad07fd664de
services:
  backend:
    image: *erpnext-image
    volumes:
      - type: bind
        source: .
        target: /qa
        read_only: true
  frontend:
    image: *erpnext-image
    ports: !override
      - "127.0.0.1:${ERP_QA_PORT:-18080}:8080"
  configurator:
    image: *erpnext-image
  create-site:
    image: *erpnext-image
  queue-long:
    image: *erpnext-image
  queue-short:
    image: *erpnext-image
  scheduler:
    image: *erpnext-image
  websocket:
    image: *erpnext-image
